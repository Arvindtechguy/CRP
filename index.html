<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-slate-900/85 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl text-center relative z-10">
        
        <!-- Animated Icon -->
        <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-2xl mb-6 floating-icon shadow-inner">
            <i class="fa-solid fa-gears text-3xl"></i>
        </div>

        <!-- Heading & Description -->
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-3">We are updating our site</h1>
        <p class="text-slate-400 text-sm sm:text-base mb-8">
            We are currently performing scheduled maintenance and updates to bring you a better experience. We'll be back shortly!
        </p>

        <!-- Progress Indicator -->
        <div class="mb-8">
            <div class="flex justify-between text-xs text-slate-400 mb-2 font-medium">
                <span>Update Progress</span>
                <span id="progress-text">50%</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-blue-500 h-2.5 rounded-full transition-all duration-500" style="width: 50%"></div>
            </div>
        </div>

        <!-- Notification Form -->
        <div class="space-y-3">
            <p class="text-xs text-slate-400">Want to get notified when we are back?</p>
            <form onsubmit="handleNotify(event)" class="flex gap-2">
                <input type="email" id="email-input" placeholder="Enter your email" required
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
                <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-colors shadow-lg shadow-indigo-600/35 cursor-pointer">
                    Notify Me
                </button>
            </form>
            <p id="success-message" class="text-xs text-emerald-400 hidden mt-2">Thank you! We'll notify you when we launch.</p>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-800/80 flex items-center justify-center text-xs text-slate-500 tracking-wide">
            Designed & Maintained by <span class="text-indigo-400 font-semibold ml-1.5">Arvind (CR)</span>
        </div>
    </div>

    <script>
        function handleNotify(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email-input');
            const successMessage = document.getElementById('success-message');
            
            if (emailInput.value) {
                emailInput.value = '';
                emailInput.disabled = true;
                successMessage.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
